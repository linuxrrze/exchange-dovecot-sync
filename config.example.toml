# Copy to config.toml (ignored by git).
# Passwords: the environment variables EXSYNC_EWS_PASSWORD / EXSYNC_IMAP_PASSWORD take precedence,
# then `password` in this file, otherwise you are prompted.
# If you store passwords here, protect the file: chmod 600 config.toml

[ews]
server = "exchange.example.org"      # host name or full EWS URL
email = "first.last@example.org"
username = "DOMAIN\\user"
auth_type = "NTLM"                   # or "basic"
verify_tls = true
# max_wait = 3600                    # longest wait (s) accepted on throttling/connection errors
# password = "..."

[dovecot]
user = "user"                        # mailbox in Dovecot
imap_host = "dovecot.example.org"
imap_port = 993
ssl = true
# master_user = "exsync"             # login as "user*exsync" (Dovecot master user)
archive_prefix = "Archiv"            # target folder for the archive mailbox
# password = "..."                   # of the user or the master user
# For Sieve: deliver new inbox mails via LMTP (requires an lmtp inet_listener in Dovecot)
# lmtp_host = "dovecot.example.org"
# lmtp_port = 24
